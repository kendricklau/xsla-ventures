    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: white;
            color: #000;
        }
        
        body {
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        
        .logo-img {
            height: 2rem;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        .progress-bar {
            height: 4px;
            background: rgba(0, 0, 0, 0.1);
        }
        
        .progress-fill {
            height: 100%;
            background: #000;
            transition: width 0.3s ease;
        }
        
        .form-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }
        
        .question-wrap {
            max-width: 600px;
            width: 100%;
        }
        
        .q-number {
            font-size: 0.875rem;
            color: rgba(0, 0, 0, 0.5);
            margin-bottom: 1rem;
        }
        
        .q-title {
            font-size: 2rem;
            font-weight: 500;
            margin: 0 0 0.5rem 0;
            line-height: 1.3;
        }
        
        .q-desc {
            font-size: 0.875rem;
            color: rgba(0, 0, 0, 0.7);
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        
        .q-desc a {
            color: inherit;
            text-decoration: underline;
        }
        
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            border: 2px solid rgba(0, 0, 0, 0.2);
            background: white;
            transition: border-color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #000;
        }
        
        input.error {
            border-color: #dc2626;
        }
        
        .error-msg {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        .error-msg.show {
            display: block;
        }
        
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        
        .radio-opt {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 2px solid rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        
        .radio-opt:hover {
            border-color: rgba(0, 0, 0, 0.5);
        }
        
        .radio-opt.selected {
            border-color: #000;
            background: rgba(0, 0, 0, 0.02);
        }
        
        .radio-opt input {
            margin-right: 0.75rem;
            cursor: pointer;
        }
        
        .radio-opt label {
            cursor: pointer;
            font-size: 1rem;
            flex: 1;
        }
        
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .btn {
            padding: 0.875rem 2rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border: 2px solid #000;
            background: transparent;
            color: #000;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover:not(:disabled) {
            background: #000;
            color: #fff;
        }
        
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: #000;
            color: #fff;
        }
        
        .fallback {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: rgba(0, 0, 0, 0.5);
        }
        
        .fallback a {
            color: inherit;
            text-decoration: underline;
        }
        
        .thank-you {
            text-align: center;
        }
        
        .thank-you h2 {
            font-size: 2.5rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }
        
        .thank-you p {
            font-size: 1rem;
            color: rgba(0, 0, 0, 0.7);
            margin-bottom: 2rem;
        }
        
        @media (max-width: 768px) {
            .q-title {
                font-size: 1.5rem;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <a href="./">
                <img src="./images/xsla-ventures-logo.png" alt="XSLA Ventures" class="logo-img">
            </a>
            <div style="color: #2C2C2C; font-size: 0.65rem; font-weight: 300; font-style: italic; margin-top: 0.25rem;">
                Pronounced <a href="https://ipa-reader.com/?text=%2Fˈ%C9%9Bks.l%C9%99%2F" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">/ˈɛks.lə/</a> — think "ex-Tesla", but leaner.
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="progress-bar">
            <div class="progress-fill" id="progress" style="width: 0%"></div>
        </div>
        
        <div class="form-area">
            <div class="question-wrap" id="content"></div>
        </div>
    </div>

    <script>
        const data = {
            firstName: '', lastName: '', email: '', company: '',
            department: '', accreditedInvestor: '', checkSize: '',
            startingCompany: '', fundraising: ''
        };

        const questions = [
            { id: 'firstName', type: 'text', title: 'First Name', required: true, entry: 'entry.1787995801' },
            { id: 'lastName', type: 'text', title: 'Last Name', required: true, entry: 'entry.967171375' },
            { id: 'email', type: 'email', title: 'Email', required: true, entry: 'entry.1398194766' },
            { id: 'company', type: 'radio', title: 'Which company were/are you affiliated with?', entry: 'entry.1739515298',
              options: ['Tesla', 'SpaceX', 'X', 'xAI', 'NeuraLink', 'Other'] },
            { id: 'department', type: 'text', title: 'What department were/are you affiliated with?', entry: 'entry.172706529' },
            { id: 'accreditedInvestor', type: 'radio', title: 'Are you an accredited investor?', entry: 'entry.53141783',
              description: '<strong>Important:</strong> You must self-identify as an accredited investor to receive <u>investment deals</u> from XSLA Ventures.<br><br><a href="https://www.sec.gov/resources-small-businesses/capital-raising-building-blocks/accredited-investors" target="_blank">SEC.gov - Accredited Investors</a><br><br><em>Financial Criteria: Net worth over $1 million, excluding primary residence (individually or with spouse or partner). Or income over $200,000 (individually) or $300,000 (with spouse or partner) in each of the prior two years, and reasonably expects the same for the current year.</em>',
              options: ['Yes', 'No', 'Decline to Answer / Not Sure'] },
            { id: 'checkSize', type: 'radio', title: "If you are an accredited investor, what's your expected or desired check size to invest into startups?", entry: 'entry.569483976',
              options: ['$1k - $5k', '$5k - $10k', '$10k - $25k', 'More than $25k', 'Decline to Answer / Not Sure'] },
            { id: 'startingCompany', type: 'radio', title: 'Are you starting a company?', entry: 'entry.279181523',
              options: ['Yes', 'No', 'Decline to Answer / Not Sure'] },
            { id: 'fundraising', type: 'radio', title: 'If you are starting a company, how much are you looking to raise?', entry: 'entry.653201755',
              options: ['Less than $1M', 'More than $1M', 'Decline to Answer / Not Sure'] }
        ];

        let current = 0;

        function updateProgress() {
            document.getElementById('progress').style.width = ((current / questions.length) * 100) + '%';
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function render() {
            const q = questions[current];
            let html = `
                <div class="q-number">${current + 1} / ${questions.length}</div>
                <h2 class="q-title">${q.title}</h2>
                ${q.description ? `<div class="q-desc">${q.description}</div>` : ''}
            `;
            
            if (q.type === 'text' || q.type === 'email') {
                html += `
                    <input type="${q.type}" id="inp" value="${data[q.id]}" placeholder="Type your answer here...">
                    <div class="error-msg" id="err">${q.type === 'email' ? 'Please enter a valid email' : 'This field is required'}</div>
                `;
            } else if (q.type === 'radio') {
                html += '<div class="radio-group">';
                q.options.forEach((opt, i) => {
                    const sel = data[q.id] === opt ? 'selected' : '';
                    const chk = data[q.id] === opt ? 'checked' : '';
                    html += `
                        <div class="radio-opt ${sel}" onclick="selectRadio('${opt}')">
                            <input type="radio" name="q" value="${opt}" ${chk}>
                            <label>${opt}</label>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            html += `
                <div class="btn-group">
                    ${current > 0 ? '<button class="btn" onclick="goBack()">Back</button>' : ''}
                    <button class="btn btn-primary" onclick="goNext()">${current === questions.length - 1 ? 'Submit' : 'Next'}</button>
                </div>
                <div class="fallback">Having trouble? <a href="https://docs.google.com/forms/d/e/1FAIpQLSelv7kxqWAIFSjcdKiSpOg-Bh-uGmpnftLTesG_y1OlFcYq7g/viewform" target="_blank">Use the original form</a></div>
            `;
            
            document.getElementById('content').innerHTML = html;
            
            if (q.type === 'text' || q.type === 'email') {
                const inp = document.getElementById('inp');
                inp.focus();
                inp.oninput = () => {
                    data[q.id] = inp.value;
                    inp.classList.remove('error');
                    document.getElementById('err').classList.remove('show');
                };
                inp.onkeypress = (e) => {
                    if (e.key === 'Enter') goNext();
                };
            }
        }

        function selectRadio(val) {
            const q = questions[current];
            data[q.id] = val;
            setTimeout(goNext, 200);
        }

        function goNext() {
            const q = questions[current];
            
            if (q.type === 'text' || q.type === 'email') {
                const inp = document.getElementById('inp');
                const err = document.getElementById('err');
                
                if (q.required && !data[q.id]) {
                    inp.classList.add('error');
                    err.classList.add('show');
                    return;
                }
                
                if (q.type === 'email' && data[q.id] && !validateEmail(data[q.id])) {
                    inp.classList.add('error');
                    err.classList.add('show');
                    return;
                }
            }
            
            if (current === questions.length - 1) {
                submit();
            } else {
                current++;
                updateProgress();
                render();
            }
        }

        function goBack() {
            if (current > 0) {
                current--;
                updateProgress();
                render();
            }
        }

        function submit() {
            const url = 'https://docs.google.com/forms/d/e/1FAIpQLSelv7kxqWAIFSjcdKiSpOg-Bh-uGmpnftLTesG_y1OlFcYq7g/formResponse';
            const form = new FormData();
            
            questions.forEach(q => {
                if (data[q.id]) form.append(q.entry, data[q.id]);
            });
            
            fetch(url, { method: 'POST', body: form, mode: 'no-cors' })
                .then(() => showThankYou())
                .catch(() => showThankYou());
        }

        function showThankYou() {
            document.getElementById('content').innerHTML = `
                <div class="thank-you">
                    <h2>Thanks for submitting your application!</h2>
                    <p>We will send you the monthly newsletter and investment deals via email.</p>
                    <a href="./" class="btn btn-primary">Return to Home</a>
                </div>
            `;
            document.getElementById('progress').style.width = '100%';
        }

        updateProgress();
        render();
    </script>
</body>
</html>
